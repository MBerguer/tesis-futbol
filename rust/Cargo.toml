[package]
name = "rust-futbol"
version = "0.1.0"
edition = "2021"


[dependencies]
axum = { version = "0.7.5", features = ["multipart"] }
sqlx = { version = "0.7.4", features = [
    "runtime-tokio",
    "macros",
    "postgres",
    "json",
    "uuid",
    "chrono",
] }
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15.0"
tower-http = { version = "0.5.0", features = ["cors", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.12.7", features = [
    "json",
    "gzip",
    "brotli",
    "deflate",
    "rustls-tls",
    "multipart",
] }
anyhow = "1.0"
once_cell = "1.19"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
regex = "1"
